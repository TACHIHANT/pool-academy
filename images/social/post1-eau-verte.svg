<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Top bar -->
  <rect width="1080" height="6" fill="#0ea5e9"/>

  <!-- Logo -->
  <text x="540" y="70" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0ea5e9">🌊 Pool Academy</text>

  <!-- Title -->
  <text x="540" y="140" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#0f172a">L'eau de votre piscine</text>
  <text x="540" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#0f172a">est <tspan fill="#0ea5e9">verte</tspan> ?</text>

  <!-- Before/After boxes -->
  <!-- Before -->
  <rect x="80" y="280" width="440" height="440" rx="24" fill="#86efac" stroke="#4ade80" stroke-width="3"/>
  <circle cx="300" cy="400" r="60" fill="#4ade80" opacity="0.5"/>
  <circle cx="260" cy="360" r="40" fill="#22c55e" opacity="0.4"/>
  <circle cx="340" cy="440" r="50" fill="#16a34a" opacity="0.3"/>
  <text x="300" y="560" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#166534">❌ AVANT</text>
  <text x="300" y="590" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#166534">Eau verte &amp; algues</text>

  <!-- Arrow -->
  <text x="540" y="500" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="48" fill="#0ea5e9">→</text>

  <!-- After -->
  <rect x="560" y="280" width="440" height="440" rx="24" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="3"/>
  <circle cx="780" cy="400" r="60" fill="#0ea5e9" opacity="0.3"/>
  <circle cx="740" cy="360" r="40" fill="#38bdf8" opacity="0.2"/>
  <circle cx="820" cy="440" r="50" fill="#0284c7" opacity="0.2"/>
  <text x="780" y="560" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#0369a1">✅ APRÈS</text>
  <text x="780" y="590" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0369a1">Eau cristalline</text>

  <!-- Steps -->
  <rect x="80" y="760" width="920" height="4" rx="2" fill="#cbd5e1"/>

  <text x="540" y="810" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#0f172a">La solution en 5 étapes →</text>

  <rect x="80" y="850" width="160" height="50" rx="10" fill="#dcfce7"/>
  <text x="160" y="882" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#16a34a">1. Vérifier pH</text>

  <rect x="260" y="850" width="160" height="50" rx="10" fill="#dcfce7"/>
  <text x="340" y="882" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#16a34a">2. Chlore choc</text>

  <rect x="440" y="850" width="160" height="50" rx="10" fill="#dcfce7"/>
  <text x="520" y="882" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#16a34a">3. Algicide</text>

  <rect x="620" y="850" width="160" height="50" rx="10" fill="#dcfce7"/>
  <text x="700" y="882" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#16a34a">4. Filtration</text>

  <rect x="800" y="850" width="200" height="50" rx="10" fill="#dcfce7"/>
  <text x="900" y="882" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#16a34a">5. Aspiration</text>

  <!-- CTA -->
  <rect x="340" y="940" width="400" height="60" rx="30" fill="url(#blueGrad)"/>
  <text x="540" y="978" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff">📘 Voir le guide complet</text>

  <!-- Bottom watermark -->
  <text x="540" y="1050" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#94a3b8">Pool Academy — Des guides PDF experts pour votre piscine</text>
</svg>
