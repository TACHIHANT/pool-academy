  <text x="175" y="306" text-anchor="middle" font-size="18" fill="#fff">✓</text>
  <text x="220" y="310" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Nettoyer le bassin</text>

  <rect x="140" y="360" width="800" height="80" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="160" y="385" width="30" height="30" rx="6" fill="#10b981"/>
  <text x="175" y="406" text-anchor="middle" font-size="18" fill="#fff">✓</text>
  <text x="220" y="410" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Ajuster le pH (7.0 - 7.2)</text>

  <rect x="140" y="460" width="800" height="80" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="160" y="485" width="30" height="30" rx="6" fill="#10b981"/>
  <text x="175" y="506" text-anchor="middle" font-size="18" fill="#fff">✓</text>
  <text x="220" y="510" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Traitement choc</text>

  <rect x="140" y="560" width="800" height="80" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="160" y="585" width="30" height="30" rx="6" fill="#10b981"/>
  <text x="175" y="606" text-anchor="middle" font-size="18" fill="#fff">✓</text>
  <text x="220" y="610" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Produit d'hivernage spécifique</text>

  <rect x="140" y="660" width="800" height="80" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="160" y="685" width="30" height="30" rx="6" fill="#10b981"/>
  <text x="175" y="706" text-anchor="middle" font-size="18" fill="#fff">✓</text>
  <text x="220" y="710" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Protéger la pompe et le filtre</text>

  <rect x="140" y="760" width="800" height="80" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="160" y="785" width="30" height="30" rx="6" fill="#10b981"/>
  <text x="175" y="806" text-anchor="middle" font-size="18" fill="#fff">✓</text>
  <text x="220" y="810" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Bâche d'hivernage renforcée</text>

  <rect x="140" y="860" width="800" height="80" rx="16" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="160" y="885" width="30" height="30" rx="6" fill="#10b981"/>
  <text x="175" y="906" text-anchor="middle" font-size="18" fill="#fff">✓</text>
  <text x="220" y="910" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" fill="#0f172a">Flotteurs anti-gel</text>

