  <rect x="290" y="970" width="500" height="55" rx="28" fill="url(#blueGradH)"/>
  <text x="540" y="1005" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">📘 Guide complet dans notre ebook</text>

  <!-- Bottom watermark -->
  <text x="540" y="1060" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#94a3b8">Pool Academy — Des guides PDF experts pour votre piscine</text>
</svg>
