  <text x="540" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800" fill="#0f172a">❄️ Checklist Hivernage</text>
  <text x="540" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" fill="#64748b">Préparez votre piscine pour l'hiver en 7 étapes</text>

